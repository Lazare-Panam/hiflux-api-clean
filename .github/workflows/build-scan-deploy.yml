name: build-scan-deploy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
env:
  REGISTRY: dimages.azurecr.io
  IMAGE: dimages.azurecr.io/hiflux-clean-api
  RESOURCE_GROUP: rg-panam-dev
jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image
        run: |
          az acr login --name dimages
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: publish
        if: github.event_name != 'pull_request'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
